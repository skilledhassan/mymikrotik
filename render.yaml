services:
  - type: web
    name: mikrotik-panel
    env: node
    plan: free
    region: frankfurt # or oregon, ohio, singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MIKROTIK_HOST
        sync: false
      - key: MIKROTIK_PORT
        value: 8728
      - key: MIKROTIK_USER
        sync: false
      - key: MIKROTIK_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENWA_BASE_URL
        value: https://openwa-2paj.onrender.com/api
      - key: OPENWA_API_KEY
        value: openwa-master-key-mikrotik-2026-secret-token
      - key: OPENWA_SESSION_ID
        value: default
      - key: OPENWA_DEFAULT_COUNTRY_CODE
        value: "92"
      - key: WHATSAPP_ENABLED
        value: "true"
      - key: ADMIN_PHONE
        value: "03101361647"
      - key: BOT_PHONE
        value: "03063677708"
